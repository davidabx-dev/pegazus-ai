<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pegazüs-AI — Acesso</title>
<style>
  :root{
    --bg:#030817;
    --panel-top:rgba(100,112,167,.36);
    --panel-bottom:rgba(14,29,66,.52);
    --stroke:rgba(214,229,255,.36);
    --text:#eaf2ff;
    --muted:#c8d0e4;
    --cyan:#00aaff;
    --blue:#007bff;
    --purple:#7c2cff;
  }

  *{box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    margin:0;
  }

  body{
    overflow:hidden;
    display:grid;
    place-items:center;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse at 53% 68%, rgba(102,46,180,.24) 0 16%, transparent 37%),
      radial-gradient(circle at 24% 26%, rgba(56,85,200,.16), transparent 27%),
      radial-gradient(circle at 80% 34%, rgba(39,108,255,.12), transparent 25%),
      linear-gradient(180deg,#04091c 0%,#071127 56%,#020614 100%);
  }

  #space{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }

  .nebula{
    position:fixed;
    inset:-20%;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 47% 62%, rgba(102,49,180,.16), transparent 22%),
      radial-gradient(ellipse at 70% 46%, rgba(33,145,255,.10), transparent 19%),
      radial-gradient(ellipse at 23% 49%, rgba(143,81,255,.08), transparent 18%);
    filter:blur(12px);
    animation:drift 14s ease-in-out infinite alternate;
  }

  .login-shell{
    position:relative;
    z-index:3;
    width:min(84vw, 455px);
    transform-style:preserve-3d;
    animation:float 5.8s ease-in-out infinite;
  }

  .login-card{
    position:relative;
    padding:68px 61px 38px;
    border-radius:16px;
    border:1px solid var(--stroke);
    background:
      linear-gradient(180deg, var(--panel-top), var(--panel-bottom)),
      rgba(9,19,42,.36);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      inset 0 -20px 60px rgba(9,16,43,.18),
      0 30px 80px rgba(0,0,0,.48),
      0 0 0 1px rgba(100,170,255,.05),
      0 0 28px rgba(73,131,255,.12);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
  }

  .login-card::before{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:15px;
    pointer-events:none;
    background:
      linear-gradient(120deg,rgba(255,255,255,.14),transparent 16% 72%,rgba(136,182,255,.08));
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    padding:1px;
  }

  .login-card::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:-18px;
    height:34px;
    background:radial-gradient(ellipse,rgba(62,145,255,.34),transparent 65%);
    filter:blur(14px);
    z-index:-1;
    opacity:.7;
  }

  .brand{
    position:absolute;
    top:-36px;
    left:50%;
    transform:translateX(-50%);
    min-width:220px;
    padding:11px 25px;
    border-radius:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    letter-spacing:.2px;
    color:#dce7fb;
    white-space:nowrap;
    background:
      linear-gradient(180deg, rgba(198,219,255,.42), rgba(88,111,159,.25));
    border:1px solid rgba(228,238,255,.42);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.38),
      0 6px 18px rgba(0,0,0,.24),
      0 0 30px rgba(121,176,255,.20);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .brand .bolt{
    font-size:31px;
    line-height:1;
    text-shadow:0 0 12px rgba(207,230,255,.9);
  }

  h1{
    margin:0 0 2px;
    font-size:35px;
    line-height:1.18;
    font-weight:500;
    letter-spacing:-.8px;
    text-align:center;
    text-shadow:0 2px 14px rgba(0,0,0,.32);
  }

  .subtitle{
    margin:0 0 22px;
    text-align:center;
    color:#d7deeb;
    font-size:14px;
    letter-spacing:.15px;
  }

  .field{
    margin-top:14px;
  }

  label{
    display:block;
    margin:0 0 5px;
    color:#d9e1ee;
    font-size:13px;
    letter-spacing:.15px;
  }

  .input-wrap{
    position:relative;
  }

  input{
    width:100%;
    height:41px;
    padding:0 13px;
    border-radius:9px;
    border:1px solid rgba(221,230,250,.34);
    outline:none;
    color:#f2f6ff;
    font-size:16px;
    background:linear-gradient(180deg,rgba(164,182,215,.26),rgba(93,112,150,.25));
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,.20),
      inset 0 0 0 1px rgba(255,255,255,.04),
      0 0 0 0 rgba(0,170,255,0);
    transition:.25s ease;
    backdrop-filter:blur(10px);
  }

  input::placeholder{color:#dae4f5;opacity:.78}

  input:focus{
    border-color:rgba(0,177,255,.72);
    box-shadow:
      0 0 0 3px rgba(0,151,255,.10),
      0 0 20px rgba(0,151,255,.12),
      inset 0 1px 4px rgba(0,0,0,.2);
    transform:translateY(-1px);
  }

  .password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#dbe5fa;
    cursor:pointer;
    font-size:14px;
    opacity:.85;
  }

  .password-toggle:hover{opacity:1}

  .actions{
    margin-top:16px;
  }

  .submit{
    position:relative;
    width:100%;
    height:45px;
    border:1px solid rgba(0,195,255,.55);
    border-radius:10px;
    cursor:pointer;
    overflow:hidden;
    color:#edf6ff;
    font-size:16px;
    font-weight:600;
    letter-spacing:.05px;
    background:
      linear-gradient(90deg,#06366a 0%,#071b4e 28%,#27126d 74%,#351281 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 0 16px rgba(0,149,255,.12),
      0 0 14px rgba(0,145,255,.26),
      0 0 23px rgba(116,26,255,.22);
    transition:.25s ease;
  }

  .submit::before{
    content:"";
    position:absolute;
    inset:-80%;
    background:linear-gradient(115deg,transparent 43%,rgba(255,255,255,.20) 50%,transparent 57%);
    transform:translateX(-48%);
    transition:transform .7s ease;
  }

  .submit:hover{
    transform:translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.13),
      0 0 18px rgba(0,166,255,.36),
      0 0 32px rgba(125,41,255,.28);
  }

  .submit:hover::before{transform:translateX(48%)}

  .submit:active{transform:translateY(1px) scale(.995)}

  .ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    background:rgba(255,255,255,.35);
    animation:ripple .65s linear;
    pointer-events:none;
  }

  .status{
    height:20px;
    margin-top:10px;
    text-align:center;
    font-size:12px;
    color:#bcd6ff;
    opacity:0;
    transform:translateY(-4px);
    transition:.25s ease;
  }

  .status.show{
    opacity:1;
    transform:translateY(0);
  }

  .hint{
    margin-top:8px;
    text-align:center;
    color:rgba(218,226,240,.56);
    font-size:11px;
  }

  @keyframes float{
    0%,100%{transform:translate3d(0,0,0)}
    50%{transform:translate3d(0,-10px,0)}
  }

  @keyframes drift{
    0%{transform:translate3d(-1.5%,0,0) scale(1)}
    100%{transform:translate3d(1.5%,-1%,0) scale(1.04)}
  }

  @keyframes ripple{
    to{transform:scale(4);opacity:0}
  }

  @media (max-width:560px){
    .login-shell{width:min(91vw,455px)}
    .login-card{padding:62px 28px 30px}
    .brand{min-width:195px;font-size:19px}
    h1{font-size:30px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      scroll-behavior:auto !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="space"></canvas>
<div class="nebula"></div>

<main class="login-shell" id="shell">
  <section class="login-card">
    <div class="brand">
      <span class="bolt">ϟ</span>
      <span>PEGAZÜS-AI</span>
    </div>

    <h1>Acessar Plataforma</h1>
    <p class="subtitle">Digite suas credenciais para entrar no painel</p>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <input id="email" name="email" type="email" placeholder="demo@pegazus.ai"
                 value="demo@pegazus.ai" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" placeholder="••••••••"
                 value="12345678" minlength="4" required />
          <button class="password-toggle" type="button" id="togglePassword" aria-label="Mostrar senha">◉</button>
        </div>
      </div>

      <div class="actions">
        <button class="submit" id="submitBtn" type="submit">
          <span>Entrar no Sistema →</span>
        </button>
      </div>

      <div class="status" id="status"></div>
      <div class="hint">Interface demonstrativa • HTML + CSS + JavaScript puro</div>
    </form>
  </section>
</main>

<script>
  // ===== Fundo espacial: estrelas + brilho =====
  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d", { alpha:true });
  let stars = [];
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    createStars();
  }

  function createStars(){
    const count = Math.round((innerWidth * innerHeight) / 5200);
    stars = Array.from({length:count}, () => ({
      x:Math.random()*innerWidth,
      y:Math.random()*innerHeight,
      r:Math.random()*1.15 + .15,
      a:Math.random()*.75 + .18,
      tw:Math.random()*Math.PI*2,
      speed:Math.random()*.010 + .004,
      drift:(Math.random()-.5)*.12
    }));
  }

  function drawStars(){
    ctx.clearRect(0,0,innerWidth,innerHeight);

    const g = ctx.createRadialGradient(
      innerWidth*.52, innerHeight*.64, 0,
      innerWidth*.52, innerHeight*.64, Math.max(innerWidth,innerHeight)*.55
    );
    g.addColorStop(0,"rgba(108,60,180,.13)");
    g.addColorStop(.35,"rgba(36,93,190,.04)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,innerWidth,innerHeight);

    for(const s of stars){
      s.tw += s.speed;
      s.x += s.drift;
      if(s.x < -5) s.x = innerWidth+5;
      if(s.x > innerWidth+5) s.x = -5;

      const pulse = (Math.sin(s.tw)+1)/2;
      const alpha = Math.min(1, s.a * (.7 + pulse*.6));

      ctx.beginPath();
      ctx.fillStyle = `rgba(208,225,255,${alpha})`;
      ctx.arc(s.x,s.y,s.r*(.85+pulse*.35),0,Math.PI*2);
      ctx.fill();

      if(s.r > .9){
        ctx.strokeStyle = `rgba(166,208,255,${alpha*.22})`;
        ctx.lineWidth = .5;
        ctx.beginPath();
        ctx.moveTo(s.x-3,s.y);
        ctx.lineTo(s.x+3,s.y);
        ctx.moveTo(s.x,s.y-3);
        ctx.lineTo(s.x,s.y+3);
        ctx.stroke();
      }
    }
    requestAnimationFrame(drawStars);
  }

  addEventListener("resize", resizeCanvas);
  resizeCanvas();
  drawStars();

  // ===== Movimento 3D suave do card =====
  const shell = document.getElementById("shell");
  const card = document.querySelector(".login-card");

  addEventListener("pointermove", (e) => {
    const x = (e.clientX / innerWidth) * 2 - 1;
    const y = (e.clientY / innerHeight) * 2 - 1;

    const rx = -y * 2.2;
    const ry = x * 2.6;

    card.style.transform = `perspective(1100px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });

  addEventListener("pointerleave", () => {
    card.style.transform = "";
  });

  // ===== Mostrar / esconder senha =====
  const password = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  togglePassword.addEventListener("click", () => {
    const visible = password.type === "text";
    password.type = visible ? "password" : "text";
    togglePassword.textContent = visible ? "◉" : "◌";
    togglePassword.setAttribute("aria-label", visible ? "Mostrar senha" : "Ocultar senha");
  });

  // ===== Ripple + feedback de login =====
  const form = document.getElementById("loginForm");
  const submit = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  submit.addEventListener("click", (e) => {
    const rect = submit.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement("span");

    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size/2) + "px";
    ripple.style.top = (e.clientY - rect.top - size/2) + "px";

    submit.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const pass = password.value.trim();

    status.textContent = "Acesso demonstrativo validado ✓";
    status.classList.add("show");

    if(!email || !pass){
      status.textContent = "Preencha os campos para continuar.";
    }

    setTimeout(() => {
      status.classList.remove("show");
    }, 2600);
  });
</script>
</body>
</html>
