[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pegazus-ai"
version = "0.2.0"
description = "Pegazus-AI: Assistente RAG Backend com FastAPI, Celery, RabbitMQ e Segurança em Camadas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "pyjwt>=2.8.0",
    "pwdlib[bcrypt]>=0.2.0",
    "slowapi>=0.1.9",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.20",
    "langchain-text-splitters>=0.0.1",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "python-multipart>=0.0.9",
    "celery>=5.3.6",
    "redis>=5.0.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "loguru>=0.7.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
    "."
]
