<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área de Upload</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
      font-family: Arial, Helvetica, sans-serif;
    }

    .upload-box {
      position: relative;
      width: 220px;
      height: 166px;
      border: 1px solid rgba(171, 193, 231, 0.75);
      border-radius: 10px;

      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(104, 137, 194, 0.20) 0%,
          rgba(62, 82, 121, 0.10) 28%,
          rgba(15, 20, 31, 0.95) 72%
        );

      box-shadow:
        inset 0 0 25px rgba(104, 138, 199, 0.08),
        0 0 8px rgba(113, 145, 203, 0.08);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* brilho lateral */
    .upload-box::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 48px;
      width: 2px;
      height: 72px;

      background: linear-gradient(
        to bottom,
        transparent,
        rgba(170, 199, 255, 0.85),
        transparent
      );

      filter: blur(1px);
      opacity: 0.9;
    }

    /* brilho superior */
    .upload-box::after {
      content: "";
      position: absolute;
      top: -1px;
      left: 45px;
      width: 130px;
      height: 2px;

      background: linear-gradient(
        to right,
        transparent,
        rgba(150, 184, 243, 0.7),
        transparent
      );

      filter: blur(1px);
    }

    .icon {
      width: 58px;
      height: 58px;
      margin-bottom: 7px;

      color: #b8cdf1;

      filter:
        drop-shadow(0 0 4px rgba(147, 180, 239, 0.35))
        drop-shadow(0 0 10px rgba(92, 130, 194, 0.15));
    }

    .title {
      color: #a4a5aa;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.05px;
      margin-bottom: 8px;
    }

    .formats {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }

    .format {
      color: #b9bbc0;
      font-size: 10px;
      line-height: 1;

      padding: 4px 5px;

      border-radius: 5px;
      border: 1px solid rgba(166, 169, 180, 0.18);

      background: linear-gradient(
        180deg,
        rgba(90, 94, 107, 0.22),
        rgba(39, 42, 52, 0.35)
      );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.035),
        0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* área clicável */
    .upload-box {
      cursor: pointer;
      user-select: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .upload-box:hover {
      border-color: rgba(190, 211, 246, 0.95);

      box-shadow:
        inset 0 0 25px rgba(104, 138, 199, 0.12),
        0 0 15px rgba(113, 145, 203, 0.13);
    }

    .upload-box:active {
      transform: scale(0.985);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>

  <label class="upload-box" for="fileInput">

    <!-- Ícone de nuvem + documento -->
    <svg
      class="icon"
      viewBox="0 0 64 64"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- nuvem -->
      <path
        d="M20 42H45.5C52.4 42 57 37.3 57 31.4C57 25.7 52.6 21.2 46.8 20.9C44.9 14.2 39.3 10 32.5 10C25.7 10 19.7 14.8 18.1 21.2C11.8 21.6 7 26.5 7 32.4C7 37.7 11.5 42 17 42H20Z"
        stroke="currentColor"
        stroke-width="2.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- documento -->
      <path
        d="M27 27.5C27 25.8 28.3 24.5 30 24.5H37L43 30.5V47C43 48.7 41.7 50 40 50H30C28.3 50 27 48.7 27 47V27.5Z"
        fill="#1b202b"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linejoin="round"
      />

      <!-- dobra do documento -->
      <path
        d="M37 24.8V29.5C37 30.3 37.7 31 38.5 31H43"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linejoin="round"
      />

      <!-- linhas -->
      <path
        d="M32 37H38"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M32 42H38"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>

    <div class="title">
      Área de Upload suportados
    </div>

    <div class="formats">
      <span class="format">PDF</span>
      <span class="format">DOCX</span>
      <span class="format">TXT</span>
      <span class="format">MD</span>
    </div>

    <input
      id="fileInput"
      type="file"
      accept=".pdf,.docx,.txt,.md"
    />
  </label>

  <script>
    const uploadBox = document.querySelector(".upload-box");
    const fileInput = document.querySelector("#fileInput");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) return;

      const allowed = [".pdf", ".docx", ".txt", ".md"];
      const extension = "." + file.name.split(".").pop().toLowerCase();

      if (!allowed.includes(extension)) {
        alert("Formato não suportado.");
        fileInput.value = "";
        return;
      }

      console.log("Arquivo selecionado:", file.name);
    });
  </script>

</body>
</html>
